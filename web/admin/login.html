<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Admin - QuanLyDuAn</title>
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-label="Đăng nhập quản trị">
        <div class="login-brand">
          <div class="brand-mark">Q</div>
          <div>
            <strong>QuanLyDuAn</strong>
            <span>Admin Panel</span>
          </div>
        </div>

        <div class="login-heading">
          <p class="eyebrow">Quản trị hệ thống</p>
          <h1>Đăng nhập Admin</h1>
          <p>Chỉ tài khoản có quyền Admin mới được truy cập bảng điều khiển.</p>
        </div>

        <form class="login-form" id="adminLoginForm">
          <label>
            Email
            <input
              id="adminEmail"
              type="email"
              autocomplete="email"
              placeholder="admin@example.com"
              required
            />
          </label>

          <label>
            Mật khẩu
            <div class="password-field">
              <input
                id="adminPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Nhập mật khẩu"
                required
              />
              <button id="togglePasswordBtn" type="button">Hiện</button>
            </div>
          </label>

          <p class="login-error" id="loginError" role="alert"></p>

          <button class="primary-btn login-submit" id="loginSubmitBtn" type="submit">
            Đăng nhập
          </button>
        </form>
      </section>
    </main>

    <script src="./js/login.js"></script>
  </body>
</html>
